dtb_file="rockchip/rk3566-rock-3c.dtb"

# uncomment to apply extra DT overlays. This is list overlays separated by white space
# dtb_overlays="rockchip/overlay/<overlay1>.dtbo rockchip/overlay/<overlay2>.dtbo"

# uncomment to have quite boot with bootsplash screen
# quiet_boot="yes"

# uncomment to add any extra params to kernel boot cmd. line
# extra_params="drm.edid_firmware=edid/s2-tek.bin"

early_con="earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8"

nfs_top_dir="mm2-nfs-networkboot-latest"
ram_top_dir="mm2-ram-networkboot-latest"


