# Config file for A733

# Minimyth2 stuff
IMAGE_BOOT_FILES += "minimyth.conf"

# Kernel stuff
IMAGE_BOOT_FILES += " \
Image \
dtbs/allwinner/overlay/*a733-*;dtbs/allwinner/overlay \
dtbs/allwinner/sun60i-*;dtbs/allwinner \
"

# Bootloader stuff
IMAGE_BOOT_FILES += " \
extlinux/extlinux.conf;extlinux/extlinux.conf \
a733loaderfiles/boot0_sdcard.bin;bootloader/boot0_sdcard.bin \
a733loaderfiles/boot_package.fex;bootloader/boot_package.fex \
"
