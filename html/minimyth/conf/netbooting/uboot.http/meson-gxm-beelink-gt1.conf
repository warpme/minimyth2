#
# to compile, run:
# ./complie.sh
#
#

dtb_file="amlogic/meson-gxm-beelink-gt1.dtb"

setenv ethaddr fa:77:8e:45:a7:b1

# uncomment to apply extra DT overlays. This is list overlays separated by white space
# dtb_overlays="amlogic/overlay/<overlay1>.dtbo amlogic/overlay/<overlay2>.dtbo"

# uncomment to have quite boot with bootsplash screen
# quiet_boot="yes"

# uncomment to add any extra params to kernel boot cmd. line
# extra_params="drm.edid_firmware=edid/s2-tek.bin video=HDMI-A-1:e"

early_con="console=ttyAML0,115200n8 console=tty0"

nfs_top_dir="mm2-nfs-networkboot-arm64-latest"
ram_top_dir="mm2-ram-networkboot-arm64-latest"


